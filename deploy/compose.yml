name: intranet

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      WIKI_DB_PASSWORD: ${WIKI_DB_PASSWORD}
      PATRIMONIO_DB_PASSWORD: ${PATRIMONIO_DB_PASSWORD}
      CHAMADOS_DB_PASSWORD: ${CHAMADOS_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - intranet

  nginx:
    image: nginx:1.28
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./nginx/intranet.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - intranet
    depends_on:
      - postgres

networks:
  intranet:

volumes:
  pgdata: