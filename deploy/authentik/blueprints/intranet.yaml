version: 1
metadata:
  name: intranet
entries:
  - model: authentik_core.group
    identifiers:
      name: wiki
    attrs:
      name: wiki
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: wiki-almoxarifado
    attrs:
      name: wiki-almoxarifado
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: wiki-financeiro
    attrs:
      name: wiki-financeiro
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: wiki-ti
    attrs:
      name: wiki-ti
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: chamados
    attrs:
      name: chamados
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: patrimonio
    attrs:
      name: patrimonio
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: chamados-atender
    attrs:
      name: chamados-atender
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: wiki-almoxarifado-editar
    attrs:
      name: wiki-almoxarifado-editar
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki-almoxarifado]]
  - model: authentik_core.group
    identifiers:
      name: wiki-financeiro-editar
    attrs:
      name: wiki-financeiro-editar
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki-financeiro]]
  - model: authentik_core.group
    identifiers:
      name: wiki-ti-editar
    attrs:
      name: wiki-ti-editar
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki-ti]]
  - model: authentik_core.group
    identifiers:
      name: wiki-geral-editar
    attrs:
      name: wiki-geral-editar
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki]]
  - model: authentik_core.group
    identifiers:
      name: setor-almoxarifado
    attrs:
      name: setor-almoxarifado
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki]]
        - !Find [authentik_core.group, [name, wiki-almoxarifado]]
        - !Find [authentik_core.group, [name, chamados]]
  - model: authentik_core.group
    identifiers:
      name: setor-financeiro
    attrs:
      name: setor-financeiro
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki]]
        - !Find [authentik_core.group, [name, wiki-financeiro]]
        - !Find [authentik_core.group, [name, chamados]]
  - model: authentik_core.group
    identifiers:
      name: setor-ti
    attrs:
      name: setor-ti
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki]]
        - !Find [authentik_core.group, [name, wiki-ti]]
        - !Find [authentik_core.group, [name, wiki-almoxarifado]]
        - !Find [authentik_core.group, [name, wiki-financeiro]]
        - !Find [authentik_core.group, [name, patrimonio]]
        - !Find [authentik_core.group, [name, chamados]]
        - !Find [authentik_core.group, [name, chamados-atender]]
  - model: authentik_core.group
    identifiers:
      name: setor-almoxarifado-editores
    attrs:
      name: setor-almoxarifado-editores
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki-almoxarifado-editar]]
  - model: authentik_core.group
    identifiers:
      name: setor-financeiro-editores
    attrs:
      name: setor-financeiro-editores
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki-financeiro-editar]]
  - model: authentik_core.group
    identifiers:
      name: setor-ti-editores
    attrs:
      name: setor-ti-editores
      is_superuser: false
      parents:
        - !Find [authentik_core.group, [name, wiki-ti-editar]]
        - !Find [authentik_core.group, [name, wiki-geral-editar]]
  - model: authentik_providers_oauth2.scopemapping
    id: intranet-groups
    identifiers:
      name: intranet-groups
    attrs:
      name: intranet-groups
      scope_name: groups
      description: Grupos efetivos da intranet
      expression: |
        return {"groups": sorted({group.name for group in request.user.all_groups()})}
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: patrimonio
    attrs:
      name: patrimonio
      client_type: confidential
      client_id: patrimonio
      client_secret: !Env PATRIMONIO_OIDC_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["http://%s/patrimonio/api/auth/callback", !Env INTRANET_IP]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf intranet-groups
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: wiki
    attrs:
      name: wiki
      client_type: confidential
      client_id: wiki
      client_secret: !Env WIKI_OIDC_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["http://%s:8081/login/wiki/callback", !Env INTRANET_IP]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf intranet-groups
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: chamados
    attrs:
      name: chamados
      client_type: confidential
      client_id: chamados
      client_secret: !Env CHAMADOS_OIDC_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["http://%s/chamados/api/auth/callback", !Env INTRANET_IP]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf intranet-groups
  - model: authentik_core.application
    identifiers:
      slug: patrimonio
    attrs:
      name: Patrimônio
      slug: patrimonio
      meta_launch_url: !Format ["http://%s/patrimonio/", !Env INTRANET_IP]
      policy_engine_mode: any
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, patrimonio]]
  - model: authentik_core.application
    identifiers:
      slug: wiki
    attrs:
      name: Wiki
      slug: wiki
      meta_launch_url: !Format ["http://%s:8081/", !Env INTRANET_IP]
      policy_engine_mode: any
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, wiki]]
  - model: authentik_core.application
    identifiers:
      slug: chamados
    attrs:
      name: Chamados
      slug: chamados
      meta_launch_url: !Format ["http://%s/chamados/", !Env INTRANET_IP]
      policy_engine_mode: any
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, chamados]]
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !Find [authentik_core.application, [slug, patrimonio]]
    attrs:
      order: 0
      group: !Find [authentik_core.group, [name, patrimonio]]
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !Find [authentik_core.application, [slug, wiki]]
    attrs:
      order: 0
      group: !Find [authentik_core.group, [name, wiki]]
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !Find [authentik_core.application, [slug, chamados]]
    attrs:
      order: 0
      group: !Find [authentik_core.group, [name, chamados]]
  - model: authentik_stages_prompt.prompt
    id: intranet-field-setor
    identifiers:
      name: intranet-field-setor
    attrs:
      name: intranet-field-setor
      field_key: setor
      label: Setor
      type: dropdown
      required: true
      placeholder_expression: true
      placeholder: |
        return ["almoxarifado", "financeiro", "ti"]
      initial_value: almoxarifado
      initial_value_expression: false
      order: 0
  - model: authentik_stages_prompt.prompt
    id: intranet-field-papel
    identifiers:
      name: intranet-field-papel
    attrs:
      name: intranet-field-papel
      field_key: papel
      label: Papel na wiki
      type: dropdown
      required: true
      placeholder_expression: true
      placeholder: |
        return ["leitor", "editor"]
      initial_value: leitor
      initial_value_expression: false
      order: 1
  - model: authentik_policies_expression.expressionpolicy
    id: intranet-enrollment-validate
    identifiers:
      name: intranet-enrollment-validate
    attrs:
      name: intranet-enrollment-validate
      expression: |
        prompt = request.context.get("prompt_data") or {}
        setor = prompt.get("setor")
        papel = prompt.get("papel")
        return setor in ("almoxarifado", "financeiro", "ti") and papel in ("leitor", "editor")
  - model: authentik_stages_prompt.promptstage
    id: intranet-enrollment-prompt
    identifiers:
      name: intranet-enrollment-prompt
    attrs:
      name: intranet-enrollment-prompt
      fields:
        - !KeyOf intranet-field-setor
        - !KeyOf intranet-field-papel
      validation_policies:
        - !KeyOf intranet-enrollment-validate
  - model: authentik_stages_user_write.userwritestage
    id: intranet-enrollment-write
    identifiers:
      name: intranet-enrollment-write
    attrs:
      name: intranet-enrollment-write
      user_creation_mode: always_create
  - model: authentik_stages_user_login.userloginstage
    id: intranet-enrollment-login
    identifiers:
      name: intranet-enrollment-login
    attrs:
      name: intranet-enrollment-login
  - model: authentik_flows.flow
    id: intranet-enrollment
    identifiers:
      slug: intranet-enrollment
    attrs:
      name: Cadastro da intranet
      title: Cadastro da intranet
      slug: intranet-enrollment
      designation: enrollment
      authentication: require_superuser
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf intranet-enrollment
      stage: !KeyOf intranet-enrollment-prompt
      order: 10
    attrs:
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf intranet-enrollment
      stage: !KeyOf intranet-enrollment-write
      order: 20
    attrs:
      order: 20
  - model: authentik_flows.flowstagebinding
    id: intranet-enrollment-login-binding
    identifiers:
      target: !KeyOf intranet-enrollment
      stage: !KeyOf intranet-enrollment-login
      order: 30
    attrs:
      order: 30
      re_evaluate_policies: true
  - model: authentik_policies_expression.expressionpolicy
    id: intranet-enrollment-groups
    identifiers:
      name: intranet-enrollment-groups
    attrs:
      name: intranet-enrollment-groups
      expression: |
        prompt = request.context.get("prompt_data") or {}
        setor = prompt.get("setor")
        papel = prompt.get("papel")
        user = request.context.get("pending_user")
        if not user or not getattr(user, "pk", None):
            return False
        if setor not in ("almoxarifado", "financeiro", "ti"):
            return False
        if papel not in ("leitor", "editor"):
            return False
        from authentik.core.models import Group
        Group.objects.get(name="setor-" + setor).users.add(user)
        if papel == "editor":
            Group.objects.get(name="setor-" + setor + "-editores").users.add(user)
        return True
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf intranet-enrollment-login-binding
    attrs:
      order: 0
      policy: !KeyOf intranet-enrollment-groups
  - model: authentik_policies_expression.expressionpolicy
    id: reset-password-check
    identifiers:
      name: reset_password_check
    attrs:
      name: reset_password_check
      expression: |
        return request.context["pending_user"].attributes.get("reset_password") == True
  - model: authentik_policies_expression.expressionpolicy
    id: reset-password-update
    identifiers:
      name: reset_password_update
    attrs:
      name: reset_password_update
      expression: |
        user = request.context["pending_user"]
        if user.attributes.get("reset_password") == True:
            user.attributes["reset_password"] = False
            user.save()
            return True
        return False
  - model: authentik_stages_prompt.promptstage
    id: intranet-reset-password-prompt
    identifiers:
      name: intranet-reset-password-prompt
    attrs:
      name: intranet-reset-password-prompt
      fields:
        - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password]]
        - !Find [authentik_stages_prompt.prompt, [name, default-password-change-field-password-repeat]]
  - model: authentik_stages_user_write.userwritestage
    id: intranet-reset-password-write
    identifiers:
      name: intranet-reset-password-write
    attrs:
      name: intranet-reset-password-write
      user_creation_mode: never_create
  - model: authentik_flows.flowstagebinding
    id: intranet-reset-password-prompt-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf intranet-reset-password-prompt
      order: 25
    attrs:
      order: 25
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf intranet-reset-password-prompt-binding
    attrs:
      order: 0
      policy: !KeyOf reset-password-check
  - model: authentik_policies_expression.expressionpolicy
    id: intranet-assign-setor
    identifiers:
      name: intranet-assign-setor
    attrs:
      name: intranet-assign-setor
      expression: |
        user = request.context["pending_user"]
        if user.is_superuser:
            return True
        setor = (user.attributes or {}).get("setor")
        papel = (user.attributes or {}).get("papel")
        if setor not in ("almoxarifado", "financeiro", "ti") or papel not in ("leitor", "editor"):
            return False
        from authentik.core.models import Group
        Group.objects.get(name="setor-" + setor).users.add(user)
        if papel == "editor":
            Group.objects.get(name="setor-" + setor + "-editores").users.add(user)
        return True
  - model: authentik_policies.policybinding
    identifiers:
      order: 10
      target: !KeyOf intranet-reset-password-prompt-binding
    attrs:
      order: 10
      policy: !KeyOf intranet-assign-setor
  - model: authentik_flows.flowstagebinding
    id: intranet-reset-password-write-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf intranet-reset-password-write
      order: 26
    attrs:
      order: 26
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !KeyOf intranet-reset-password-write-binding
    attrs:
      order: 0
      policy: !KeyOf reset-password-update
  - model: authentik_policies_expression.expressionpolicy
    id: intranet-admin-reset-password
    identifiers:
      name: intranet-admin-reset-password
    attrs:
      name: intranet-admin-reset-password
      expression: |
        pending = request.context.get("pending_user")
        if pending is None or not request.user.is_superuser or pending.pk == request.user.pk:
            return True
        attrs = dict(pending.attributes or {})
        attrs["reset_password"] = True
        pending.attributes = attrs
        pending.save()
        return True
  - model: authentik_policies.policybinding
    identifiers:
      order: 0
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, default-password-change]]], [stage, !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]]]
    attrs:
      order: 0
      policy: !KeyOf intranet-admin-reset-password
